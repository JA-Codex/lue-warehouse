# ============================================================================ DQ-06 Range
# Phase 1: dates between 2023-07-01 and the run date, amounts within plausible bounds. The window is
# 2023-07-01 to 2026-06-30. Leases may have started before it (legacy leases) and run past it, so
# they get a plausibility range; a settlement can arrive up to a month after the window closes.

[[rule]]
id = "S1-LEA-10"
check = "DQ-06"
table = "brz_lease"
type = "date_range"
columns = ["start_date", "end_date"]
min = "2015-01-01"
max = "2035-12-31"
severity = "reject"
message = "lease date outside 2015 to 2035"

[[rule]]
id = "S1-LEA-11"
check = "DQ-06"
table = "brz_lease"
type = "condition"
sql = "EXISTS (SELECT 1 FROM lue_staging.brz_unit u WHERE u.unit_id = b.unit_id AND lue_audit.try_numeric(b.monthly_rent) NOT BETWEEN (CASE u.unit_type WHEN 'Apartment' THEN 5000 WHEN 'Office' THEN 10000 ELSE 10000 END) AND (CASE u.unit_type WHEN 'Apartment' THEN 1000000 WHEN 'Office' THEN 2000000 ELSE 1500000 END))"
show = ["unit_id", "monthly_rent"]
severity = "reject"
message = "rent outside the plausible band for the unit type"
bad = { monthly_rent = "99999999.00" }

[[rule]]
id = "S1-LEV-06"
check = "DQ-06"
table = "brz_lease_event"
type = "date_range"
columns = ["event_date"]
min = "2023-07-01"
max = "2026-06-30"
severity = "reject"
message = "event date outside the window"

[[rule]]
id = "S1-INV-05"
check = "DQ-06"
table = "brz_invoice"
type = "date_range"
columns = ["invoice_date"]
min = "2023-07-01"
max = "2026-06-30"
severity = "reject"
message = "invoice date outside the window"

[[rule]]
id = "S1-INL-09"
check = "DQ-06"
table = "brz_invoice_line"
type = "number_range"
columns = ["billed_amount", "net_amount"]
min = 0
max = 5000000
abs = true
severity = "reject"
message = "amount above the cap of 5,000,000"
fixture_where = "b.tax_amount = '0.00' AND b.discount_amount = '0.00'"
bad = { billed_amount = "50000001.00", net_amount = "50000001.00" }

[[rule]]
id = "S1-PAY-09"
check = "DQ-06"
table = "brz_payment"
