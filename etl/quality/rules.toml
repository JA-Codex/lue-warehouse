# ============================================================================ DQ-03 Duplicate
# Decision D15: an EXACT duplicate (same key, same values) in one batch is quarantined, keeping the
# first by ingestion order. A CONFLICTING duplicate (same key, different values) is a warning and
# both go on to staging, where survivorship keeps the latest (US-5.1).

[[rule]]
id = "S1-INL-04"
check = "DQ-03"
table = "brz_invoice_line"
type = "duplicate_exact"
key = ["invoice_number", "line_no"]
severity = "reject"
message = "exact duplicate in the batch"

[[rule]]
id = "S1-PAY-04"
check = "DQ-03"
table = "brz_payment"
type = "duplicate_exact"
key = ["payment_reference"]
severity = "reject"
message = "exact duplicate in the batch"

[[rule]]
id = "S3-SET-04"
check = "DQ-03"
table = "brz_settlement"
type = "duplicate_exact"
key = ["settlement_id"]
severity = "reject"
message = "settlement line repeated in its file"

[[rule]]
id = "S4-TKT-04"
check = "DQ-03"
table = "brz_ticket"
type = "duplicate_exact"
key = ["ticket_id"]
severity = "reject"
message = "ticket exported twice"

[[rule]]
id = "S4-TKT-05"
check = "DQ-03"
table = "brz_ticket"
type = "duplicate_conflict"
key = ["ticket_id"]
severity = "warn"
message = "ticket exported twice with different values; staging keeps the latest"

[[rule]]
id = "S5-WEA-04"
check = "DQ-03"
table = "brz_weather"
type = "duplicate_exact"
key = ["city", "weather_date"]
severity = "reject"
message = "exact duplicate in the batch"

[[rule]]
id = "S6-LOG-03"
check = "DQ-03"
table = "brz_incentive_log"
type = "duplicate_exact"
key = ["building_code", "unit_no", "offer_code", "start_date"]
severity = "reject"
message = "offer logged twice"

# ============================================================================ DQ-04 Business rule
# Phase 1: net = billed + tax - discount; lease end after start; resolved after raised; payment
# above 0 unless a reversal. The plan adds: due date on or after issue date, no overlapping leases.

[[rule]]
id = "S1-INL-05"
check = "DQ-04"
table = "brz_invoice_line"
type = "condition"
sql = "lue_audit.try_numeric(b.net_amount) <> lue_audit.try_numeric(b.billed_amount) + lue_audit.try_numeric(b.tax_amount) - lue_audit.try_numeric(b.discount_amount)"
show = ["billed_amount", "tax_amount", "discount_amount", "net_amount"]
severity = "reject"
message = "net is not billed + tax - discount"
bad = { net_amount = "1.00" }

[[rule]]
id = "S1-INL-06"
check = "DQ-04"
table = "brz_invoice_line"
type = "condition"
where = "b.charge_code = 'RENT'"
sql = "NOT EXISTS (SELECT 1 FROM lue_staging.brz_invoice i JOIN lue_staging.brz_lease l ON l.lease_number = i.lease_number WHERE i.invoice_number = b.invoice_number AND lue_audit.try_numeric(l.monthly_rent) = lue_audit.try_numeric(b.billed_amount)) AND EXISTS (SELECT 1 FROM lue_staging.brz_invoice i JOIN lue_staging.brz_lease l ON l.lease_number = i.lease_number WHERE i.invoice_number = b.invoice_number)"
show = ["invoice_number", "billed_amount"]
severity = "warn"
message = "rent billed differs from the lease's monthly rent (a mid-lease change)"
fixture_where = "b.tax_amount = '0.00' AND b.discount_amount = '0.00'"
bad = { billed_amount = "1.00", net_amount = "1.00" }

[[rule]]
id = "S1-INV-03"
check = "DQ-04"
table = "brz_invoice"
type = "condition"
sql = "lue_audit.try_date(b.due_date) < lue_audit.try_date(b.invoice_date)"
show = ["invoice_date", "due_date"]
severity = "reject"
message = "due date before the invoice date"
bad = { due_date = "2023-07-01", invoice_date = "2023-07-15" }

[[rule]]
id = "S1-LEA-05"
check = "DQ-04"
table = "brz_lease"
type = "condition"
sql = "lue_audit.try_date(b.end_date) <= lue_audit.try_date(b.start_date)"
show = ["start_date", "end_date"]
severity = "reject"
message = "lease ends before it starts"
bad = { end_date = "2020-01-01" }

[[rule]]
id = "S1-LEA-06"
check = "DQ-04"
table = "brz_lease"
type = "condition"
sql = "EXISTS (SELECT 1 FROM lue_staging.brz_lease o WHERE o.unit_id = b.unit_id AND o.lease_number <> b.lease_number AND lue_audit.try_date(o.start_date) <= lue_audit.try_date(b.end_date) AND lue_audit.try_date(b.start_date) <= lue_audit.try_date(o.end_date))"
show = ["unit_id", "start_date", "end_date"]
severity = "reject"
message = "overlaps another lease on the same unit"
bad = { lease_number = "L-1900-00001" }

[[rule]]
id = "S1-PAY-05"
check = "DQ-04"
table = "brz_payment"
type = "condition"
sql = "(coalesce(btrim(b.reversal_of), '') = '' AND lue_audit.try_numeric(b.amount) <= 0) OR (coalesce(btrim(b.reversal_of), '') <> '' AND lue_audit.try_numeric(b.amount) >= 0)"
show = ["amount", "reversal_of"]
severity = "reject"
message = "amount must be above 0 (below 0 only for a reversal)"
fixture_where = "coalesce(b.reversal_of, '') = ''"
bad = { amount = "-10.00" }

[[rule]]
id = "S2-OSH-03"
check = "DQ-04"
table = "brz_ownership"
type = "condition"
sql = "coalesce(btrim(b.valid_to), '') <> '' AND lue_audit.try_date(b.valid_to) < lue_audit.try_date(b.valid_from)"
show = ["valid_from", "valid_to"]
severity = "reject"
message = "ownership ends before it starts"
bad = { valid_from = "2026-01-01", valid_to = "2025-01-01" }

[[rule]]
id = "S3-SET-05"
check = "DQ-04"
table = "brz_settlement"
type = "condition"
sql = "lue_audit.try_numeric(b.net_amount) <> lue_audit.try_numeric(b.gross_amount) - lue_audit.try_numeric(b.fee_amount) OR lue_audit.try_date(b.settlement_date) < lue_audit.try_date(b.transaction_date)"
show = ["transaction_date", "settlement_date", "gross_amount", "fee_amount", "net_amount"]
severity = "reject"
message = "net is not gross - fee, or settled before the payment"
bad = { net_amount = "1.00" }

[[rule]]
id = "S4-TST-03"
check = "DQ-04"
table = "brz_ticket_status"
type = "condition"
where = "b.status = 'Resolved'"
sql = "EXISTS (SELECT 1 FROM lue_staging.brz_ticket_status r WHERE r.source_file = b.source_file AND r.source_row = b.source_row AND r.status = 'Raised' AND lue_audit.try_timestamp(r.status_at) > lue_audit.try_timestamp(b.status_at))"
show = ["ticket_id", "status_at"]
severity = "reject"
message = "resolved before it was raised"
bad = { status_at = "2023-01-01 00:00:00" }

[[rule]]
id = "S6-LOG-04"
check = "DQ-04"
table = "brz_incentive_log"
type = "condition"
sql = "lue_audit.try_date(b.end_date) < lue_audit.try_date(b.start_date)"
show = ["start_date", "end_date"]
severity = "reject"
message = "offer ends before it starts"
bad = { start_date = "2025-05-01", end_date = "2025-04-01" }

# ============================================================================ DQ-05 Referential
# Phase 1: every invoice's lease, unit and tenant exist; missing unit -> quarantine; missing tenant
# -> inferred member (US-6.5): a tenant (or vendor) that is not there yet is a warning, not a
# rejection, because it may arrive in a later extract.

[[rule]]
id = "S1-UNT-06"
check = "DQ-05"
table = "brz_unit"
type = "reference"
columns = ["building_code"]
ref_table = "brz_building"
ref_columns = ["building_code"]
severity = "reject"
message = "building not found"

[[rule]]
id = "S1-LEA-07"
check = "DQ-05"
table = "brz_lease"
type = "reference"
