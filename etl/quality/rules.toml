# ============================================================================ DQ-03 Duplicate
# Decision D15: an EXACT duplicate (same key, same values) in one batch is quarantined, keeping the
# first by ingestion order. A CONFLICTING duplicate (same key, different values) is a warning and
# both go on to staging, where survivorship keeps the latest (US-5.1).

[[rule]]
id = "S1-INL-04"
check = "DQ-03"
table = "brz_invoice_line"
type = "duplicate_exact"
key = ["invoice_number", "line_no"]
severity = "reject"
message = "exact duplicate in the batch"

[[rule]]
id = "S1-PAY-04"
check = "DQ-03"
table = "brz_payment"
type = "duplicate_exact"
key = ["payment_reference"]
severity = "reject"
message = "exact duplicate in the batch"

[[rule]]
id = "S3-SET-04"
check = "DQ-03"
table = "brz_settlement"
type = "duplicate_exact"
key = ["settlement_id"]
severity = "reject"
message = "settlement line repeated in its file"

[[rule]]
id = "S4-TKT-04"
check = "DQ-03"
table = "brz_ticket"
type = "duplicate_exact"
key = ["ticket_id"]
severity = "reject"
message = "ticket exported twice"

[[rule]]
id = "S4-TKT-05"
check = "DQ-03"
table = "brz_ticket"
type = "duplicate_conflict"
key = ["ticket_id"]
severity = "warn"
message = "ticket exported twice with different values; staging keeps the latest"

[[rule]]
id = "S5-WEA-04"
check = "DQ-03"
table = "brz_weather"
type = "duplicate_exact"
key = ["city", "weather_date"]
severity = "reject"
message = "exact duplicate in the batch"

[[rule]]
id = "S6-LOG-03"
check = "DQ-03"
table = "brz_incentive_log"
type = "duplicate_exact"
key = ["building_code", "unit_no", "offer_code", "start_date"]
severity = "reject"
message = "offer logged twice"

