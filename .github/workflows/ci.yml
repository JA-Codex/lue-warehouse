name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job name is the status-check name. Require "ci" in the main ruleset after the first run.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install -r requirements-ci.txt
      - name: Lint, SQL parse check and frozen-pack check
        run: make test
